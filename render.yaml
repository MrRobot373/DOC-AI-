# ============================================================
# DOC-AI — Render Blueprint (Infrastructure as Code)
# Render reads this file and provisions every service below, wired together.
#
#   • web      — Flask API (Docker image with LibreOffice baked in → REAL page
#                numbers; no separate Gotenberg service needed)
#   • redis    — managed Key Value store (FREE tier) used as the job queue
#   • worker   — durable review worker: pulls jobs from Redis so reviews survive
#                restarts and run in parallel. Uploads/reports are shared via
#                Supabase Storage, so the worker (separate disk) can read them.
#
# COST (Render): Key Value has a free tier; a background `worker` and an
# always-on `web` are paid (~$7/mo each on Starter). The web can run `free`
# (sleeps when idle).
#
# ---- FREE / single-instance setup ----
# Delete the `worker` and `redis` services and remove REDIS_URL from `web`. The
# web service (LibreOffice baked in) still does reviews in-process via threading
# AND still produces real page numbers. You only lose crash-safety/parallelism.
#
# REQUIRED before the worker is useful: set the SUPABASE_* vars so uploads/reports
# go to shared storage (the worker is a separate container with its own disk).
# ============================================================

envVarGroups:
  - name: doc-ai-shared
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY      # backend writes reviews/audit/storage
        sync: false
      - key: SUPABASE_JWT_SECRET            # verifies user JWTs locally (fast)
        sync: false
      - key: ALLOWED_ORIGINS                # e.g. https://your-app.vercel.app

services:
  - type: keyvalue
    name: doc-ai-redis
    plan: free
    ipAllowList: []          # empty = only other Render services can connect

  - type: web
    name: doc-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter            # "free" to avoid cost (sleeps when idle)
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: REDIS_URL        # enables the durable queue; remove for threading
        fromService:
          type: keyvalue
          name: doc-ai-redis
          property: connectionString
      - fromGroup: doc-ai-shared

  - type: worker
    name: doc-ai-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python backend/worker.py
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: doc-ai-redis
          property: connectionString
      - fromGroup: doc-ai-shared
